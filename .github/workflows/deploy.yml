name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Models are not versioned (GitHub rejects files > 100 MB and Pages does not serve LFS),
      # so they are downloaded here and cached between runs.
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Fetch models
        run: |
          if [ -f scripts/fetch-models.mjs ]; then
            npm run fetch-models
          else
            echo "scripts/fetch-models.mjs not present yet; skipping"
          fi

      - run: npm run check

      - name: Build for the repository sub-path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
